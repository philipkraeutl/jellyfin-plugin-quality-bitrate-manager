name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - jellyfin-version: 10.11.0
            framework: net9.0
            dotnet-version: 9.0.x
          - jellyfin-version: 10.11.11
            framework: net9.0
            dotnet-version: 9.0.x
          - jellyfin-version: 12.0.0-rc3
            framework: net10.0
            dotnet-version: 10.0.x
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet-version }}
      - run: dotnet restore QualityBitrateManager.slnx -p:JellyfinTargetFramework=${{ matrix.framework }} -p:JellyfinVersion=${{ matrix.jellyfin-version }}
      - run: dotnet test QualityBitrateManager.slnx --configuration Release --no-restore -p:JellyfinTargetFramework=${{ matrix.framework }} -p:JellyfinVersion=${{ matrix.jellyfin-version }}
      - run: dotnet publish src/Jellyfin.Plugin.QualityBitrateManager --configuration Release --no-restore -p:JellyfinTargetFramework=${{ matrix.framework }} -p:JellyfinVersion=${{ matrix.jellyfin-version }}
      - name: Upload plugin DLL
        uses: actions/upload-artifact@v4
        with:
          name: quality-bitrate-manager-${{ matrix.jellyfin-version }}-${{ github.sha }}
          path: src/Jellyfin.Plugin.QualityBitrateManager/bin/Release/${{ matrix.framework }}/publish/Jellyfin.Plugin.QualityBitrateManager.dll
          if-no-files-found: error
