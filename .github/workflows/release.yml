name: Release plugin

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version from build.yaml, for example 1.0.0.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, verify and release
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Determine and validate release version
        id: version
        shell: pwsh
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') {
              $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
              $env:DISPATCH_VERSION.Trim() -replace '^v', ''
          }

          if ($version -notmatch '^\d+\.\d+\.\d+\.\d+$') {
              throw "Release version '$version' must contain four numeric parts, for example 1.0.0.0."
          }

          $manifestVersion = (Select-String -Path build.yaml -Pattern '^version:\s*"?([^"\s]+)"?\s*$').Matches.Groups[1].Value
          [xml]$project = Get-Content src/Jellyfin.Plugin.QualityBitrateManager/Jellyfin.Plugin.QualityBitrateManager.csproj
          $packageVersion = $project.Project.PropertyGroup.Version
          $assemblyVersion = $project.Project.PropertyGroup.AssemblyVersion
          $fileVersion = $project.Project.PropertyGroup.FileVersion

          if ($version -ne $manifestVersion -or $version -ne $packageVersion -or $version -ne $assemblyVersion -or $version -ne $fileVersion) {
              throw "Version mismatch: release=$version, build.yaml=$manifestVersion, Version=$packageVersion, AssemblyVersion=$assemblyVersion, FileVersion=$fileVersion"
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Restore dependencies
        run: dotnet restore QualityBitrateManager.slnx

      - name: Run tests
        run: dotnet test QualityBitrateManager.slnx --configuration Release --no-restore

      - name: Create plugin package and checksum
        shell: pwsh
        run: ./scripts/package.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Update Jellyfin repository manifest
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $archive = "artifacts/quality-bitrate-manager_$env:RELEASE_VERSION.zip"
          $checksum = (Get-FileHash -Algorithm MD5 -LiteralPath $archive).Hash.ToUpperInvariant()
          $sourceUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/v$env:RELEASE_VERSION/quality-bitrate-manager_$env:RELEASE_VERSION.zip"
          $manifest = @(Get-Content manifest.json -Raw | ConvertFrom-Json)
          $entry = [ordered]@{
              version = $env:RELEASE_VERSION
              changelog = "See the GitHub release notes for this version."
              targetAbi = "10.11.0.0"
              sourceUrl = $sourceUrl
              checksum = $checksum
              timestamp = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          }
          $olderVersions = @($manifest[0].versions | Where-Object { $_.version -ne $env:RELEASE_VERSION })
          $manifest[0].versions = @($entry) + $olderVersions
          ConvertTo-Json -InputObject $manifest -Depth 10 | Set-Content manifest.json -Encoding utf8

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quality-bitrate-manager-${{ steps.version.outputs.version }}
          path: |
            artifacts/quality-bitrate-manager_${{ steps.version.outputs.version }}.zip
            artifacts/quality-bitrate-manager_${{ steps.version.outputs.version }}.zip.sha256
            manifest.json
          if-no-files-found: error

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            "artifacts/quality-bitrate-manager_${RELEASE_VERSION}.zip" \
            "artifacts/quality-bitrate-manager_${RELEASE_VERSION}.zip.sha256" \
            --target "$GITHUB_SHA" \
            --title "Quality Bitrate Manager $RELEASE_VERSION" \
            --generate-notes

      - name: Publish updated Jellyfin manifest
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          cp manifest.json "$RUNNER_TEMP/manifest.json"
          git fetch origin "$DEFAULT_BRANCH"
          git checkout -B "$DEFAULT_BRANCH" "origin/$DEFAULT_BRANCH"
          cp "$RUNNER_TEMP/manifest.json" manifest.json
          if ! git diff --quiet -- manifest.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add manifest.json
            git commit -m "Update plugin manifest for v${RELEASE_VERSION}"
            git push origin "HEAD:${DEFAULT_BRANCH}"
          fi
